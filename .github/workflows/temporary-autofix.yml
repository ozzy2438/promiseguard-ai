name: temporary-autofix

on:
  push:
    branches:
      - "chatgpt/project-prompt"

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, '[skip-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/project-prompt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install "ruff==0.16.3"
      - name: Apply reviewed semantic cleanups
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def update(path: str, transforms: tuple[tuple[str, str], ...]) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              for old, new in transforms:
                  text = text.replace(old, new)
              target.write_text(text, encoding="utf-8")

          update(
              "src/promiseguard/models.py",
              (
                  ("from enum import Enum", "from enum import StrEnum"),
                  ("(str, Enum):", "(StrEnum):"),
              ),
          )
          update(
              "src/promiseguard/openai_models.py",
              (
                  ("from enum import Enum", "from enum import StrEnum"),
                  ("(str, Enum):", "(StrEnum):"),
              ),
          )
          update(
              "src/promiseguard/observability.py",
              (
                  ("from typing import Any", "from typing import Any, ClassVar"),
                  (
                      "    reserved = set(logging.LogRecord(None, 0, \"\", 0, \"\", (), None).__dict__)",
                      "    reserved: ClassVar[set[str]] = set(\n"
                      "        logging.LogRecord(None, 0, \"\", 0, \"\", (), None).__dict__\n"
                      "    )",
                  ),
              ),
          )
          update(
              "src/promiseguard/optimizer.py",
              (
                  ("from decimal import Decimal\n", "from decimal import Decimal\nfrom typing import ClassVar\n"),
                  (
                      "    _tie_break_priority = {",
                      "    _tie_break_priority: ClassVar[dict[RecoveryAction, int]] = {",
                  ),
              ),
          )
          update(
              "src/promiseguard/synthetic.py",
              (
                  ("from pathlib import Path\n", "from pathlib import Path\nfrom typing import ClassVar\n"),
                  (
                      "    fulfilment_centres = (\"FC-MEL\", \"FC-SYD\", \"FC-BNE\")",
                      "    fulfilment_centres: ClassVar[tuple[str, ...]] = (\n"
                      "        \"FC-MEL\", \"FC-SYD\", \"FC-BNE\"\n"
                      "    )",
                  ),
                  (
                      "    stores = tuple(f\"STORE-{index:02d}\" for index in range(1, 16))",
                      "    stores: ClassVar[tuple[str, ...]] = tuple(\n"
                      "        f\"STORE-{index:02d}\" for index in range(1, 16)\n"
                      "    )",
                  ),
                  (
                      "    carriers = {\"AUSPOST\": 0.9, \"FASTWAY\": 0.82}",
                      "    carriers: ClassVar[dict[str, float]] = {\n"
                      "        \"AUSPOST\": 0.9,\n"
                      "        \"FASTWAY\": 0.82,\n"
                      "    }",
                  ),
                  (
                      "    segments = (\"STANDARD\", \"LOYAL\", \"VIP\")",
                      "    segments: ClassVar[tuple[str, ...]] = (\"STANDARD\", \"LOYAL\", \"VIP\")",
                  ),
              ),
          )
          update(
              "src/promiseguard/training.py",
              (
                  ("from hashlib import sha256\n", "from hashlib import sha256\nfrom itertools import pairwise\n"),
                  (
                      "    for lower, upper in zip(boundaries[:-1], boundaries[1:], strict=True):",
                      "    for lower, upper in pairwise(boundaries):",
                  ),
              ),
          )
          update(
              "src/promiseguard/verification.py",
              (
                  (
                      "        if execution.status is ActionStatus.COMPENSATED:\n"
                      "            status = VerificationStatus.FAILED\n"
                      "        elif not action_postcondition:\n"
                      "            status = VerificationStatus.FAILED",
                      "        if (\n"
                      "            execution.status is ActionStatus.COMPENSATED\n"
                      "            or not action_postcondition\n"
                      "        ):\n"
                      "            status = VerificationStatus.FAILED",
                  ),
              ),
          )
          PY
      - name: Apply Ruff fixes and formatting
        run: |
          ruff check --fix --unsafe-fixes .
          ruff format .
          ruff check .
          ruff format --check .
      - name: Commit quality fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No quality changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -d '' files < <(git diff --name-only -z)
          git add -- "${files[@]}"
          git commit -m "chore: satisfy repository quality gates [skip-autofix]"
          git push origin HEAD:chatgpt/project-prompt
