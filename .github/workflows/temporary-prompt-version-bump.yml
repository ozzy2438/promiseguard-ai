name: temporary-prompt-version-bump

on:
  push:
    branches:
      - "chatgpt/prompt-version-v2"

permissions:
  contents: write

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[prompt-v2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/prompt-version-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bump audited prompt version
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/promiseguard/openai_agent.py")
          text = path.read_text(encoding="utf-8")
          old = 'PROMPT_VERSION = "promiseguard-openai-review-v1"'
          new = 'PROMPT_VERSION = "promiseguard-openai-review-v2"'
          if old not in text:
              raise SystemExit("expected prompt version not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m pip install --upgrade pip
          pip install -e ".[dev,agent]"
          ruff check .
          ruff format --check .
          mypy src/promiseguard
          pytest -m "not live_openai"
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/promiseguard/openai_agent.py
          git commit -m "chore: bump OpenAI review prompt version to v2 [prompt-v2-applied]"
          git push origin HEAD:chatgpt/prompt-version-v2
