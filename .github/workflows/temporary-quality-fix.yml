name: temporary-quality-fix

on:
  push:
    branches:
      - "chatgpt/project-prompt"

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[quality-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/project-prompt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install "ruff==0.16.4"
      - name: Apply reviewed semantic repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old in text:
                  p.write_text(text.replace(old, new), encoding="utf-8")

          for path in ("src/promiseguard/models.py", "src/promiseguard/openai_models.py"):
              replace(path, "from enum import Enum", "from enum import StrEnum")
              replace(path, "(str, Enum):", "(StrEnum):")

          replace(
              "src/promiseguard/observability.py",
              "from typing import Any",
              "from typing import Any, ClassVar",
          )
          replace(
              "src/promiseguard/observability.py",
              '    reserved = set(logging.LogRecord(None, 0, "", 0, "", (), None).__dict__)',
              '    reserved: ClassVar[set[str]] = set(\n'
              '        logging.LogRecord(None, 0, "", 0, "", (), None).__dict__\n'
              '    )',
          )

          replace(
              "src/promiseguard/optimizer.py",
              "from decimal import Decimal\n",
              "from decimal import Decimal\nfrom typing import ClassVar\n",
          )
          replace(
              "src/promiseguard/optimizer.py",
              "    _tie_break_priority = {",
              "    _tie_break_priority: ClassVar[dict[RecoveryAction, int]] = {",
          )

          replace(
              "src/promiseguard/synthetic.py",
              "from pathlib import Path\n",
              "from pathlib import Path\nfrom typing import ClassVar\n",
          )
          replace(
              "src/promiseguard/synthetic.py",
              "    carriers = {",
              "    carriers: ClassVar[dict[str, float]] = {",
          )

          replace(
              "src/promiseguard/training.py",
              "from hashlib import sha256\n",
              "from hashlib import sha256\nfrom itertools import pairwise\n",
          )
          replace(
              "src/promiseguard/training.py",
              "    for lower, upper in zip(boundaries[:-1], boundaries[1:], strict=True):",
              "    for lower, upper in pairwise(boundaries):",
          )

          replace(
              "src/promiseguard/verification.py",
              "        if execution.status is ActionStatus.COMPENSATED:\n"
              "            status = VerificationStatus.FAILED\n"
              "        elif not action_postcondition:\n"
              "            status = VerificationStatus.FAILED",
              "        if execution.status is ActionStatus.COMPENSATED or not action_postcondition:\n"
              "            status = VerificationStatus.FAILED",
          )
          PY
      - name: Apply Ruff safe and unsafe fixes
        run: |
          ruff check --fix --unsafe-fixes .
          ruff format .
          ruff check .
          ruff format --check .
      - name: Commit repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No quality changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -d '' files < <(git diff --name-only -z)
          git add -- "${files[@]}"
          git commit -m "chore: satisfy repository quality gates [quality-repaired]"
          git push origin HEAD:chatgpt/project-prompt
