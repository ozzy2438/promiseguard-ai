services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: promiseguard
      POSTGRES_USER: promiseguard
      POSTGRES_PASSWORD: promiseguard-local-only
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promiseguard -d promiseguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - promiseguard-postgres:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: >-
        postgresql+psycopg://promiseguard:promiseguard-local-only@postgres:5432/promiseguard
      AUTO_CREATE_SCHEMA: "false"
      PROMISEGUARD_ENV: local-docker
      PROMISEGUARD_STRICT_LOCAL_IDENTITY: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-auto}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      OPENAI_BUDGET_USD: ${OPENAI_BUDGET_USD:-3.00}
      OPENAI_PER_RUN_LIMIT_USD: ${OPENAI_PER_RUN_LIMIT_USD:-0.001}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-320}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      OPENAI_RESERVATION_TTL_SECONDS: ${OPENAI_RESERVATION_TTL_SECONDS:-600}
    ports:
      - "${PROMISEGUARD_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  console:
    build:
      context: .
      dockerfile: Dockerfile.console
    environment:
      PROMISEGUARD_API_URL: http://api:8000
    ports:
      - "${PROMISEGUARD_CONSOLE_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  promiseguard-postgres:
