services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: promiseguard
      POSTGRES_USER: promiseguard
      POSTGRES_PASSWORD: promiseguard-local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promiseguard -d promiseguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - promiseguard-postgres:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: >-
        postgresql+psycopg://promiseguard:promiseguard-local-only@postgres:5432/promiseguard
      AUTO_CREATE_SCHEMA: "false"
      PROMISEGUARD_ENV: local-docker
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  promiseguard-postgres:
